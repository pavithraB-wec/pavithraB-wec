name: Generate Contribution Graphs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Spider-Verse Snake (unchanged from your existing snake.yml)
      - name: Generate snake animation(s)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF2E63&color_dots=%23161B22,%23303D4D,%235B5FFF,%238A2BE2,%23FF2E63
            dist/github-contribution-grid-snake-light.svg?color_snake=%23FF2E63&color_dots=%23EBEDF0,%23C6E48B,%237BC96F,%23239636,%23196F3D

      # 2. Flappy Bird (unchanged from your existing flappy.yml)
      - name: Generate flappy-contribution-graph.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-flappy-svg.js ${{ github.repository_owner }} dist/flappy-contribution-graph.svg

      # 3. ONE deploy step pushes all three SVGs together - nothing can wipe anything else out
      - name: Push all SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
