name: Generate Spider-Verse Snake

on:
  schedule:
    # runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation(s)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF2E63,%2300C2FF&color_dots=%232B3137,%23454D5D,%236A5ACD,%23A855F7,%23FF2E63
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF2E63,%2300C2FF&color_dots=%230F0F1A,%233A0CA3,%237209B7,%23F72585,%2300C2FF

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
