name: Generate Spider-Verse Snake

on:
  schedule:
    # runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation(s)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF2E63&color_dots=%23161B22,%23303D4D,%235B5FFF,%238A2BE2,%23FF2E63
            dist/github-contribution-grid-snake-light.svg?color_snake=%23FF2E63&color_dots=%23EBEDF0,%23C6E48B,%237BC96F,%23239636,%23196F3D

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


          name: Generate Flappy Bird Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate flappy-contribution-graph.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-flappy-svg.js ${{ github.repository_owner }} dist/flappy-contribution-graph.svg

      - name: Push SVG to its own output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-flappy
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
