name: Generate Contribution Graphs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Flappy Bird SVG -> writes to dist/flappy-contribution-graph.svg
      - name: Generate Flappy Bird SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-flappy-svg.js ${{ github.repository_owner }} dist/flappy-contribution-graph.svg

      # 2. Spider-Verse Snake SVG -> writes to dist/snake.svg (also fine, same dist folder)
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg

      # 3. ONE deploy step pushes both files together, so neither ever gets wiped by the other
      - name: Push both SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
